<article class="card">
  <div class="card-imagen">
    <img
      [src]="'assets/img/' + noticia().imagen"
      [alt]="noticia().titulo"
      loading="lazy"
      width="400"
      height="200"
    />
    <span class="badge">{{ noticia().categoria }}</span>
  </div>

  <div class="card-cuerpo">
    <h3>
      <a [routerLink]="['/noticias', noticia().id]">{{ noticia().titulo }}</a>
    </h3>
    <p>{{ noticia().descripcion }}</p>

    <div class="card-pie">
      <button
        class="btn-favorito"
        type="button"
        [class.activo]="esFavorito()"
        [attr.aria-pressed]="esFavorito()"
        [attr.aria-label]="esFavorito() ? 'Quitar de favoritos' : 'Guardar en favoritos'"
        (click)="alternarFavorito()"
      >
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />
        </svg>
      </button>

      <a class="leer-mas" [routerLink]="['/noticias', noticia().id]">
        Ver más
        <span aria-hidden="true">&rarr;</span>
      </a>
    </div>
  </div>
</article>
